server {
 listen 8080;
 server_name _;
 root /usr/share/nginx/html;
 client_max_body_size 21m;
 client_body_timeout 30s;
 add_header X-Content-Type-Options nosniff always;
 add_header X-Frame-Options DENY always;
 add_header Referrer-Policy same-origin always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
 location /api/ {
  proxy_hide_header X-Content-Type-Options;
  proxy_hide_header X-Frame-Options;
  proxy_hide_header Referrer-Policy;
  proxy_hide_header Content-Security-Policy;
  proxy_pass http://backend:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
 location / { try_files $uri $uri/ /index.html; }
}
